# YOLO12 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo12
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 5 # number of classes | Chỉnh sửa từ 80 -> 5 cho 5 loại vật liệu tái chế
scales: # model compound scaling constants, i.e. 'model=yolo12n.yaml' will call yolo12.yaml with scale 'n'
  # [depth, width, max_channels]
  m: [0.50, 1.00, 512] # summary: 292 layers, 20,199,168 parameters, 20,199,152 gradients, 68.1 GFLOPs

# YOLO12n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3 Output
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]    # 6
  - [-1, 1, CBAM, [512]]         # 7-P4 Output (Học vật liệu)
  - [-1, 1, Conv, [1024, 3, 2]]  # 8-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]   # 9
  - [-1, 1, CBAM, [1024]]        # 10-P5 Output (Tổng hợp ngữ cảnh)

# YOLO12n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 7], 1, Concat, [1]]    # 12: cat backbone P4 (Layer 7)
  - [-1, 2, A2C2f, [512, False, -1]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]    # 15: cat backbone P3 (Layer 4)
  - [-1, 2, A2C2f, [256, False, -1]] # 16
  - [-1, 1, SimAM, []]           # 17: (P3 Detect Branch) - Xử lý vật thể nhỏ/đè nhau

  - [-1, 1, Conv, [256, 3, 2]]   # 18
  - [[-1, 13], 1, Concat, [1]]   # 19: cat head P4 (Layer 13)
  - [-1, 2, A2C2f, [512, False, -1]] # 20
  - [-1, 1, SimAM, []]           # 21: (P4 Detect Branch) - Tách lớp vật liệu đè nhau

  - [-1, 1, Conv, [512, 3, 2]]   # 22
  - [[-1, 10], 1, Concat, [1]]   # 23: cat backbone P5 (Layer 10)
  - [-1, 2, C3k2, [1024, True]]  # 24
  - [-1, 1, SimAM, []]           # 25: (P5 Detect Branch) - Chốt chặn cuối

  - [[17, 21, 25], 1, Detect, [nc]] # 26: Detect(P3, P4, P5)